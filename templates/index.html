<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Calibration</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<!-- ═══════════ CAMERA PICKER MODAL ═══════════ -->
<div id="cam-modal-overlay" class="cam-modal-overlay" style="display:none">
  <div class="cam-modal">
    <h2>Select Camera</h2>
    <div class="cam-modal-subtitle" id="cam-modal-subtitle">Scanning for connected cameras…</div>
    <div class="cam-grid" id="cam-grid">
      <div class="cam-scanning">Scanning…</div>
    </div>
    <div class="cam-modal-footer">
      <button class="btn sm" onclick="closeCameraPicker()">Cancel</button>
      <button class="btn sm" onclick="rescanCameras()">↺ Rescan</button>
    </div>
  </div>
</div>

<!-- ═══════════ HEADER ═══════════ -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a7cff" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>Camera Calibration</h1>
      <span>ChArUco · AprilTag · OpenCV</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="top-tabs" id="top-tabs">
      <button class="top-tab active" data-tab="calibrate" onclick="switchTab('calibrate')">Calibrate</button>
      <button class="top-tab" data-tab="debug" onclick="switchTab('debug')">Debug &amp; Tune</button>
      <button class="top-tab" data-tab="evaluate" onclick="switchTab('evaluate')">Evaluate</button>
    </div>
    <button class="cam-change-btn" title="Change camera" onclick="openCameraPicker()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
    <span class="status-dot" id="cam-dot"></span>
    <span style="font-size:11px;font-family:var(--mono);color:var(--text-dim)" id="cam-status-text">Camera off</span>
  </div>
</div>

<!-- ═══════════ STEP BAR ═══════════ -->
<div class="steps" id="step-bar"></div>

<!-- ═══════════ MAIN ═══════════ -->
<div class="main">
  <div class="feed-area" id="feed-area">
    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1">
        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>
      </svg>
      <p>Connect your camera and follow the steps on the right to calibrate it.</p>
    </div>
    <img id="stream-img" style="display:none" />
    <div id="evaluate-area" style="display:none;width:100%;height:100%"></div>
  </div>

  <div class="sidebar">
    <div class="sidebar-scroll" id="sidebar-content"></div>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </div>
</div>

<!-- ═══════════ TOAST ═══════════ -->
<div id="toast" style="display:none"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/state.js"></script>
<script src="/static/js/stream.js"></script>
<script src="/static/js/camera.js"></script>
<script src="/static/js/steps/welcome.js"></script>
<script src="/static/js/steps/print.js"></script>
<script src="/static/js/steps/capture.js"></script>
<script src="/static/js/steps/extrinsic.js"></script>
<script src="/static/js/steps/handeye.js"></script>
<script src="/static/js/steps/adjust.js"></script>
<script src="/static/js/steps/export.js"></script>
<script src="/static/js/debug.js"></script>
<script src="/static/js/evaluate.js"></script>
<script src="/static/js/nav.js"></script>
</body>
</html>
