<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Calibration</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c10; --panel: #101118; --panel2: #161820;
    --border: rgba(74,124,255,0.08); --border2: rgba(74,124,255,0.14);
    --accent: #4a7cff; --accent-light: #6c9bff; --accent-dim: rgba(74,124,255,0.10);
    --green: #34d399; --red: #f87171; --amber: #fbbf24;
    --text: #c8ccd4; --text-dim: #5e6370; --text-micro: #3a3e4a;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'DM Sans', 'Helvetica Neue', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ─── HEADER ─── */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 30; height: 30; border-radius: 7px; border: 1.5px solid rgba(74,124,255,0.35); display: grid; place-items: center; }
  .logo-text h1 { font-size: 15px; font-weight: 500; color: #e8eaef; letter-spacing: -0.01em; }
  .logo-text span { font-size: 10px; font-family: var(--mono); color: var(--text-micro); letter-spacing: 0.06em; text-transform: uppercase; }

  /* ─── TOP TABS ─── */
  .top-tabs { display: flex; gap: 2px; background: var(--panel2); border-radius: 8px; padding: 3px; }
  .top-tab { padding: 6px 16px; border-radius: 6px; font-size: 12px; font-family: var(--sans); font-weight: 500; color: var(--text-dim); cursor: pointer; border: none; background: none; transition: all 0.2s; white-space: nowrap; }
  .top-tab:hover { color: var(--text); background: rgba(74,124,255,0.06); }
  .top-tab.active { color: #e8eaef; background: var(--accent-dim); border: 1px solid rgba(74,124,255,0.2); }

  /* ─── DEBUG SPECIFIC ─── */
  .debug-section { margin-bottom: 18px; }
  .debug-section .section-label { margin-bottom: 8px; }
  .debug-import-area { width: 100%; min-height: 80px; max-height: 160px; padding: 10px; border-radius: 6px; border: 1px dashed var(--border2); background: var(--panel2); color: var(--text-dim); font-family: var(--mono); font-size: 10px; resize: vertical; line-height: 1.5; }
  .debug-import-area:focus { outline: none; border-color: var(--accent); color: var(--text); }
  .debug-metric { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; line-height: 2; }
  .debug-metric .label { color: var(--text-dim); }
  .debug-metric .value { color: var(--text); }

  /* ─── STEP BAR ─── */
  .steps { display: flex; align-items: center; gap: 0; padding: 0 24px; height: 44px; border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto; }
  .step-item { display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 100%; cursor: default; position: relative; white-space: nowrap; }
  .step-num { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-family: var(--mono); font-weight: 500; border: 1.5px solid var(--text-micro); color: var(--text-micro); transition: all 0.3s; }
  .step-label { font-size: 11px; color: var(--text-micro); transition: all 0.3s; letter-spacing: 0.02em; }
  .step-item.active .step-num { border-color: var(--accent); color: #fff; background: var(--accent); }
  .step-item.active .step-label { color: var(--accent-light); }
  .step-item.done .step-num { border-color: var(--green); color: var(--green); background: rgba(52,211,153,0.1); }
  .step-item.done .step-label { color: rgba(52,211,153,0.6); }
  .step-sep { width: 20px; height: 1px; background: var(--text-micro); opacity: 0.3; flex-shrink: 0; }

  /* ─── LAYOUT ─── */
  .main { flex: 1; display: flex; overflow: hidden; }
  .feed-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background: var(--bg); }
  .feed-area img, .feed-area video { max-width: 100%; max-height: 100%; border-radius: 4px; }
  .sidebar { width: 360px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 24px 22px; scrollbar-width: thin; scrollbar-color: #1e2028 transparent; }
  .sidebar-footer { padding: 16px 22px; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 8px; }

  /* ─── COMPONENTS ─── */
  .section-label { font-size: 9px; font-family: var(--mono); color: var(--text-micro); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; margin-top: 18px; }
  .section-label:first-child { margin-top: 0; }
  .hint { font-size: 13px; line-height: 1.7; color: var(--text-dim); margin-bottom: 14px; }
  .hint strong { color: var(--text); font-weight: 500; }
  .hint em { color: var(--accent-light); font-style: normal; }

  .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }

  .btn { padding: 10px 22px; border-radius: 8px; border: 1px solid var(--border2); background: var(--accent-dim); color: var(--accent-light); font-size: 13px; font-family: var(--sans); font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: rgba(74,124,255,0.18); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #5a8aff; }
  .btn.sm { padding: 6px 14px; font-size: 11px; }
  .btn.full { width: 100%; }
  .btn.danger { border-color: rgba(248,113,113,0.2); color: var(--red); background: rgba(248,113,113,0.06); }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-family: var(--mono); }
  .badge.green { background: rgba(52,211,153,0.08); color: var(--green); border: 1px solid rgba(52,211,153,0.15); }
  .badge.amber { background: rgba(251,191,36,0.08); color: var(--amber); border: 1px solid rgba(251,191,36,0.15); }
  .badge.blue { background: var(--accent-dim); color: var(--accent-light); border: 1px solid var(--border2); }
  .badge.red { background: rgba(248,113,113,0.08); color: var(--red); border: 1px solid rgba(248,113,113,0.15); }

  .matrix { background: rgba(74,124,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-family: var(--mono); font-size: 11px; line-height: 2; color: var(--text-dim); }
  .matrix .val { color: #8a9bcc; }

  /* ─── SLIDER ─── */
  .slider-group { margin-bottom: 10px; }
  .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .slider-header .lbl { font-size: 10px; font-family: var(--mono); color: #8a8f98; letter-spacing: 0.04em; }
  .slider-header .val { font-size: 11px; font-family: var(--mono); color: var(--text); }
  .slider-header input.val {
    background: none; border: 1px solid transparent; border-radius: 4px;
    text-align: right; padding: 1px 4px; width: auto; min-width: 60px; max-width: 110px;
    transition: border-color 0.15s, background 0.15s;
  }
  .slider-header input.val:hover { border-color: var(--border2); background: var(--panel2); }
  .slider-header input.val:focus { outline: none; border-color: var(--accent); background: var(--panel2); color: #e8eaef; }
  .slider-track { position: relative; height: 20px; display: flex; align-items: center; }
  .slider-track .bg { position: absolute; width: 100%; height: 2px; background: #2a2d35; border-radius: 1px; }
  .slider-track .fill { position: absolute; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-light)); border-radius: 1px; }
  .slider-track input[type=range] { position: absolute; width: 100%; height: 20px; opacity: 0; cursor: pointer; margin: 0; }
  .slider-track .thumb { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); box-shadow: 0 0 8px rgba(74,124,255,0.25); pointer-events: none; transition: left 0.05s; }

  /* ─── CAPTURES GRID ─── */
  .captures-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .capture-thumb { border-radius: 6px; overflow: hidden; aspect-ratio: 16/9; background: var(--panel2); border: 1px solid var(--border); position: relative; }
  .capture-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .capture-thumb .idx { position: absolute; top: 4px; left: 6px; font-size: 9px; font-family: var(--mono); color: var(--accent-light); background: rgba(11,12,16,0.7); padding: 1px 5px; border-radius: 3px; }

  /* ─── PLACEHOLDER ─── */
  .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px; text-align: center; height: 100%; }
  .placeholder svg { opacity: 0.15; }
  .placeholder p { font-size: 14px; color: var(--text-dim); max-width: 380px; line-height: 1.6; }

  /* ─── STATUS DOT ─── */
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-dot.on { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,0.4); }
  .status-dot.off { background: var(--red); }

  /* ─── PROGRESS ─── */
  .progress-bar { height: 3px; background: #1a1c24; border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
  .progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); transition: width 0.3s; border-radius: 2px; }

  /* ─── TOAST ─── */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 999; animation: toast-in 0.3s ease; }
  .toast.ok { background: rgba(52,211,153,0.15); color: var(--green); border: 1px solid rgba(52,211,153,0.2); }
  .toast.err { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
  @keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  /* ─── DIVIDER ─── */
  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* ─── PRINT PREVIEW ─── */
  .print-preview { background: white; border-radius: 8px; padding: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .print-preview img { max-width: 100%; max-height: 200px; }

  /* ─── ANIM ─── */
  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  @media print { body * { display: none !important; } .print-target { display: block !important; } }
</style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a7cff" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>Camera Calibration</h1>
      <span>ChArUco · AprilTag · OpenCV</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="top-tabs" id="top-tabs">
      <button class="top-tab active" data-tab="calibrate" onclick="switchTab('calibrate')">Calibrate</button>
      <button class="top-tab" data-tab="debug" onclick="switchTab('debug')">Debug &amp; Tune</button>
    </div>
    <span class="status-dot" id="cam-dot"></span>
    <span style="font-size:11px;font-family:var(--mono);color:var(--text-dim)" id="cam-status-text">Camera off</span>
  </div>
</div>

<!-- ═══════════ STEP BAR ═══════════ -->
<div class="steps" id="step-bar"></div>

<!-- ═══════════ MAIN ═══════════ -->
<div class="main">
  <div class="feed-area" id="feed-area">
    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1">
        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>
      </svg>
      <p>Connect your camera and follow the steps on the right to calibrate it.</p>
    </div>
    <img id="stream-img" style="display:none" />
  </div>

  <div class="sidebar">
    <div class="sidebar-scroll" id="sidebar-content"></div>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </div>
</div>

<!-- ═══════════ TOAST ═══════════ -->
<div id="toast" style="display:none"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
const STEP_DEFS = [
  { id: "welcome",     label: "Welcome" },
  { id: "print",       label: "Print Boards" },
  { id: "capture",     label: "Capture" },
  { id: "intrinsic",   label: "Intrinsic" },
  { id: "ext-capture", label: "Tag Capture" },
  { id: "extrinsic",   label: "Extrinsic" },
  { id: "he-capture",  label: "Hand-Eye" },
  { id: "he-result",   label: "HE Result" },
  { id: "he-adjust",   label: "HE Adjust" },
  { id: "adjust",      label: "Adjust" },
  { id: "export",      label: "Export" },
];

let currentStep = 0;
let captures = [];        // thumbnail b64 strings
let calibrationResult = null;
let extrinsicResult = null;
let handeyePairs = [];    // {thumbnail, ee_pose}
let handeyeResult = null;
let statusPoll = null;
let lastStatus = {};

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
const $ = s => document.querySelector(s);
const api = async (path, opts) => {
  try {
    const r = await fetch(path, opts);
    return await r.json();
  } catch (e) { return { ok: false, error: e.message }; }
};
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });

function toast(msg, ok = true) {
  const t = $("#toast");
  t.className = "toast " + (ok ? "ok" : "err");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._t);
  t._t = setTimeout(() => t.style.display = "none", 3000);
}

function startStatusPoll() {
  if (statusPoll) return;
  statusPoll = setInterval(async () => {
    lastStatus = await api("/api/status");
  }, 250);
}
function stopStatusPoll() {
  if (statusPoll) { clearInterval(statusPoll); statusPoll = null; }
}

function startStream(mode) {
  post("/api/mode", { mode });
  const img = $("#stream-img");
  img.src = "/api/stream?" + Date.now();
  img.style.display = "block";
  $("#placeholder").style.display = "none";
  startStatusPoll();
}

function stopStream() {
  const img = $("#stream-img");
  img.src = "";
  img.style.display = "none";
  post("/api/stream/stop");
  post("/api/mode", { mode: "idle" });
  stopStatusPoll();
}

function fmtNum(v, d = 2) {
  if (typeof v !== "number") return "—";
  return d === 0 ? Math.round(v).toString() : v.toFixed(d);
}

// Shared: sync a typed value from the number input back to the range slider + visuals
function sliderValFromInput(groupId, inputEl, min, max, step, callback) {
  // Strip common unit suffixes before parsing
  let raw = inputEl.value.replace(/\s*(px|rad|m|mm|°)\s*$/i, "").trim();
  let val = parseFloat(raw);
  if (isNaN(val)) return;
  val = Math.max(min, Math.min(max, val));
  const rangeEl = document.querySelector(`#sg-${groupId} input[type=range]`);
  if (rangeEl) { rangeEl.value = val; }
  callback(val);
}

// ═══════════════════════════════════════════════════════════════
//  STEP BAR RENDERING
// ═══════════════════════════════════════════════════════════════
function renderStepBar() {
  const bar = $("#step-bar");
  bar.innerHTML = "";
  STEP_DEFS.forEach((s, i) => {
    if (i > 0) { const sep = document.createElement("div"); sep.className = "step-sep"; bar.appendChild(sep); }
    const el = document.createElement("div");
    el.className = "step-item" + (i === currentStep ? " active" : "") + (i < currentStep ? " done" : "");
    el.innerHTML = `<div class="step-num">${i < currentStep ? "✓" : i + 1}</div><div class="step-label">${s.label}</div>`;
    el.onclick = () => { if (i <= currentStep) goStep(i); };
    el.style.cursor = i <= currentStep ? "pointer" : "default";
    bar.appendChild(el);
  });
}

// ═══════════════════════════════════════════════════════════════
//  STEP CONTENT RENDERING
// ═══════════════════════════════════════════════════════════════
function goStep(idx) {
  currentStep = idx;
  renderStepBar();
  const content = $("#sidebar-content");
  const footer = $("#sidebar-footer");
  content.innerHTML = "";
  footer.innerHTML = "";

  switch (STEP_DEFS[idx].id) {
    case "welcome":     renderWelcome(content, footer); break;
    case "print":       renderPrint(content, footer); break;
    case "capture":     renderCapture(content, footer); break;
    case "intrinsic":   renderIntrinsic(content, footer); break;
    case "ext-capture": renderExtCapture(content, footer); break;
    case "extrinsic":   renderExtrinsic(content, footer); break;
    case "he-capture":  renderHECapture(content, footer); break;
    case "he-result":   renderHEResult(content, footer); break;
    case "he-adjust":   renderHEAdjust(content, footer); break;
    case "adjust":      renderAdjust(content, footer); break;
    case "export":      renderExport(content, footer); break;
  }
  content.classList.add("fade-in");
}

// ───────── WELCOME ─────────
function renderWelcome(c, f) {
  stopStream();
  $("#stream-img").style.display = "none";
  $("#placeholder").style.display = "flex";
  c.innerHTML = `
    <div class="section-label">Welcome</div>
    <div class="hint">This tool will guide you through <strong>full camera calibration</strong> in two stages:</div>
    <div class="card">
      <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:12px">
        <span class="badge blue" style="flex-shrink:0">Step 1</span>
        <div>
          <div style="font-size:13px;color:var(--text);margin-bottom:4px;font-weight:500">Intrinsic Calibration</div>
          <div style="font-size:12px;color:var(--text-dim);line-height:1.6">Using a <em>ChArUco board</em>, we'll estimate your camera's focal length, principal point, and lens distortion.</div>
        </div>
      </div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span class="badge blue" style="flex-shrink:0">Step 2</span>
        <div>
          <div style="font-size:13px;color:var(--text);margin-bottom:4px;font-weight:500">Extrinsic Calibration</div>
          <div style="font-size:12px;color:var(--text-dim);line-height:1.6">Using an <em>AprilTag</em> with known position, we'll solve for your camera's 6-DOF pose in the world.</div>
        </div>
      </div>
      <div style="height:1px;background:var(--border);margin:12px 0"></div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span class="badge blue" style="flex-shrink:0">Step 3</span>
        <div>
          <div style="font-size:13px;color:var(--text);margin-bottom:4px;font-weight:500">Touch-Point Calibration <span style="font-size:10px;color:var(--text-micro);font-weight:400">(optional)</span></div>
          <div style="font-size:12px;color:var(--text-dim);line-height:1.6">If your camera observes a robot workspace, we'll compute the camera ↔ robot transform via <em>touch-point registration</em> (SVD Procrustes). Physically touch the AprilTag center with the robot TCP — no rotation input needed.</div>
        </div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="section-label">What you'll need</div>
    <div class="hint">
      <strong>1.</strong> A printer (we'll generate the boards for you)<br>
      <strong>2.</strong> A flat surface to mount the ChArUco board<br>
      <strong>3.</strong> A ruler or tape measure (to enter real dimensions)<br>
      <strong>4.</strong> Your camera connected to this computer<br>
      <strong>5.</strong> <em>Optional:</em> Robot with accessible EE pose readout (for hand-eye calibration)
    </div>
    <div class="card" style="border-color:rgba(52,211,153,0.15)">
      <div style="font-size:12px;color:var(--green);line-height:1.6">
        <strong>Tip:</strong> For best results, capture the board from many angles and distances — fill different parts of the frame. We need at least 4 views, but 8–12 is better.
      </div>
    </div>`;
  f.innerHTML = `<button class="btn primary full" onclick="goStep(1)">Let's Begin →</button>`;
}

// ───────── PRINT BOARDS ─────────
function renderPrint(c, f) {
  stopStream();
  $("#stream-img").style.display = "none";
  $("#placeholder").style.display = "flex";
  c.innerHTML = `
    <div class="section-label">Print Your Calibration Boards</div>
    <div class="hint">You need to print <strong>two targets</strong>. Click each button to download a high-resolution PNG. Print at <em>actual size</em> (no scaling) on a flat sheet.</div>

    <div class="card">
      <div style="font-size:13px;color:var(--text);margin-bottom:8px;font-weight:500">① ChArUco Board</div>
      <div style="font-size:12px;color:var(--text-dim);line-height:1.6;margin-bottom:10px">7×5 squares with ArUco markers. Used for intrinsic calibration. Mount on a rigid flat surface (cardboard, clipboard, etc).</div>
      <div class="print-preview"><img src="/api/board/charuco" alt="ChArUco board" /></div>
      <a href="/api/board/charuco" download="charuco_board.png" class="btn sm full" style="text-align:center;text-decoration:none;display:block">⬇ Download ChArUco Board</a>
    </div>

window.startCapturing = function() {
  captures = [];
  post("/api/capture/clear");
  goStep(2);
  startStream("charuco");
  updateCamDot(true);
}

function updateCamDot(on) {
  $("#cam-dot").className = "status-dot " + (on ? "on" : "off");
  $("#cam-status-text").textContent = on ? "Camera active" : "Camera off";
}

// ───────── CAPTURE (INTRINSIC) ─────────
function renderCapture(c, f) {
  const minCap = 4;
  c.innerHTML = `
    <div class="section-label">Capture ChArUco Views</div>
    <div class="hint">Point your camera at the printed ChArUco board. The overlay shows detected corners in <em>orange</em>. Move the board to different positions and angles.</div>
    <div class="progress-bar"><div class="fill" id="cap-progress" style="width:${Math.min(100, (captures.length / minCap) * 100)}%"></div></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span class="badge ${captures.length >= minCap ? 'green' : 'amber'}" id="cap-badge">${captures.length} / ${minCap}+ captures</span>
      <span class="badge blue" id="corner-badge">— corners</span>
    </div>
    <div class="card" style="border-color:rgba(52,211,153,0.15)">
      <div style="font-size:12px;color:var(--green);line-height:1.7">
        <strong>Tips for good calibration:</strong><br>
        • Tilt the board at different angles (15–45°)<br>
        • Move it to all four corners of the frame<br>
        • Vary the distance (close and far)<br>
        • Keep the board still when capturing<br>
        • Avoid motion blur — good lighting helps
      </div>
    </div>
    <div class="captures-grid" id="cap-grid"></div>
    <div id="capture-feedback" style="font-size:12px;color:var(--text-dim);text-align:center;min-height:20px"></div>`;

  f.innerHTML = `
    <button class="btn danger sm" onclick="clearCaptures()">Clear All</button>
    <button class="btn" style="flex:1" id="snap-btn" onclick="snapIntrinsic()">📸 Capture Frame</button>
    <button class="btn primary" id="cal-btn" ${captures.length < minCap ? 'disabled' : ''} onclick="goStep(3);runCalibration()">Calibrate →</button>`;
  // Live corner count updater
  if (!window._capInterval) {
    window._capInterval = setInterval(() => {
      if (currentStep !== 2) { clearInterval(window._capInterval); window._capInterval = null; return; }
      const b = document.getElementById("corner-badge");
      if (b && lastStatus.charuco_count !== undefined) {
        b.textContent = `${lastStatus.charuco_count} corners`;
        b.className = "badge " + (lastStatus.charuco_enough ? "green" : "amber");

function renderCaptureGrid() {
  const grid = document.getElementById("cap-grid");
  if (!grid) return;
  grid.innerHTML = captures.map((t, i) =>
    `<div class="capture-thumb"><img src="data:image/jpeg;base64,${t}" /><div class="idx">#${i + 1}</div></div>`
  ).join("");
}

window.snapIntrinsic = async function() {
  const btn = document.getElementById("snap-btn");
  const fb = document.getElementById("capture-feedback");
  btn.disabled = true;
  btn.textContent = "Capturing…";
  const r = await post("/api/capture/intrinsic");
  btn.disabled = false;
  btn.textContent = "📸 Capture Frame";
  if (r.ok) {
    captures.push(r.thumbnail);
    toast(`Captured! ${r.corners_found} corners detected`);
    fb.style.color = "var(--green)";
    fb.textContent = `Frame #${captures.length} saved — ${r.corners_found} corners`;
    renderCaptureGrid();
    const p = document.getElementById("cap-progress");
    if (p) p.style.width = Math.min(100, (captures.length / 4) * 100) + "%";
    const b = document.getElementById("cap-badge");
    if (b) { b.textContent = `${captures.length} / 4+ captures`; b.className = "badge " + (captures.length >= 4 ? "green" : "amber"); }
    const cb = document.getElementById("cal-btn");
    if (cb && captures.length >= 4) cb.disabled = false;
  } else {
    toast(r.error || "Capture failed", false);
    fb.style.color = "var(--red)";
    fb.textContent = r.error || "Not enough corners — reposition the board";
  }
}

window.clearCaptures = function() {
  captures = [];
  post("/api/capture/clear");
  renderCapture($("#sidebar-content"), $("#sidebar-footer"));
}

// ───────── INTRINSIC RESULT ─────────
async function runCalibration() {
  const c = $("#sidebar-content");
  c.innerHTML = `
    <div class="section-label">Calibrating…</div>
    <div class="hint">Running Zhang's method on ${captures.length} captured frames. This may take a moment.</div>
    <div style="text-align:center;padding:40px"><div class="badge blue">⏳ Computing…</div></div>`;
  const r = await post("/api/calibrate/intrinsic");
  if (r.ok) {
    calibrationResult = r.result;
    toast(`Calibration complete — RPE: ${r.result.rpe} px`);
    renderIntrinsic($("#sidebar-content"), $("#sidebar-footer"));
  } else {
    toast(r.error || "Calibration failed", false);
    c.innerHTML = `
      <div class="section-label" style="color:var(--red)">Calibration Failed</div>
      <div class="hint">${r.error || "Unknown error"}. Try capturing more frames from diverse angles.</div>`;
    $("#sidebar-footer").innerHTML = `<button class="btn full" onclick="goStep(2)">← Back to Capture</button>`;
  }
}

  if (!calibrationResult) { runCalibration(); return; }
  const r = calibrationResult;
  stopStream();
  startStream("undistort");
  c.innerHTML = `
    <div class="section-label">Intrinsic Calibration Result</div>
    <div class="hint">Camera intrinsics estimated from <strong>${r.num_frames} frames</strong>. The live feed now shows the <em>undistorted</em> image.</div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <span class="badge ${r.rpe < 0.5 ? 'green' : r.rpe < 1.0 ? 'amber' : 'red'}">RPE: ${r.rpe} px</span>
      <span class="badge blue">${r.image_size[0]}×${r.image_size[1]}</span>
    </div>

    <div class="section-label">Camera Matrix K</div>
    <div class="matrix">
      <div style="display:flex;justify-content:space-between"><span class="val">${fmtNum(r.fx)}</span><span>0</span><span class="val">${fmtNum(r.cx)}</span></div>
      <div style="display:flex;justify-content:space-between"><span>0</span><span class="val">${fmtNum(r.fy)}</span><span class="val">${fmtNum(r.cy)}</span></div>
      <div style="display:flex;justify-content:space-between"><span>0</span><span>0</span><span>1</span></div>
    </div>

    <div class="section-label">Distortion Coefficients</div>
    <div class="card" style="font-family:var(--mono);font-size:11px;line-height:2">
      <div style="display:flex;justify-content:space-between"><span style="color:var(--text-dim)">k₁</span><span class="val">${fmtNum(r.k1, 6)}</span></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--text-dim)">k₂</span><span class="val">${fmtNum(r.k2, 6)}</span></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--text-dim)">p₁</span><span class="val">${fmtNum(r.p1, 6)}</span></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--text-dim)">p₂</span><span class="val">${fmtNum(r.p2, 6)}</span></div>
    </div>

    <div class="card" style="font-family:var(--mono);font-size:11px">
      ${r.per_view_errors.map((e, i) => `<div style="display:flex;justify-content:space-between;line-height:1.8"><span style="color:var(--text-dim)">Frame ${i+1}</span><span style="color:${e < 0.5 ? 'var(--green)' : e < 1 ? 'var(--amber)' : 'var(--red)'}">${e} px</span></div>`).join("")}
    </div>

    <div class="card" style="border-color:rgba(52,211,153,0.15)">
      <div style="font-size:12px;color:var(--green);line-height:1.6">
        ${r.rpe < 0.5 ? "✓ Excellent calibration! RPE < 0.5 px is very good."
          : r.rpe < 1.0 ? "⚠ Decent calibration. For better results, capture more frames from diverse angles."
          : "⚠ High reprojection error. Consider recapturing with more frames and better angles."}
      </div>
    </div>`;
  f.innerHTML = `
    <button class="btn" onclick="goStep(2)">← Recapture</button>
    <button class="btn primary" style="flex:1" onclick="goStep(4)">Extrinsic Calibration →</button>`;
}

// ───────── EXTRINSIC CAPTURE ─────────

window.snapExtrinsic = async function() {

  btn.textContent = "Capturing…";

// ───────── EXTRINSIC RESULT ─────────
function renderExtrinsic(c, f) {
  if (!extrinsicResult) { goStep(4); return; }

  stopStream();

  // Show annotated thumbnail

    </div>`;

// ───────── HAND-EYE CAPTURE (touch-point only) ─────────
function renderHECapture(c, f) {
  startStream("handeye");
  updateCamDot(true);
  const tagMM = document.getElementById('tag-size')?.value || document.getElementById('ext-tag-size')?.value || 50;
  post("/api/handeye/config", { tag_size: parseFloat(tagMM) / 1000 });

  c.innerHTML = `
    <div class="section-label">Touch-Point Calibration</div>
    <div class="hint">The camera is <strong>fixed</strong> and observes the workspace. The robot physically <strong>touches the center of the AprilTag</strong> with its calibrated TCP. This gives direct 3D point correspondences — <em>no rotation needed</em>.</div>

    <div style="font-family:var(--mono);font-size:10px;color:var(--text-dim);line-height:1.8;padding:8px 12px;background:rgba(74,124,255,0.04);border-radius:6px;margin-bottom:12px">
      <span style="color:var(--green)">Fixed Camera</span> → observes → <span style="color:var(--accent-light)">AprilTag (fixed)</span> ← touched by ← <span style="color:var(--amber)">Robot TCP</span>
    </div>

    <div class="card" style="border-color:rgba(74,124,255,0.15)">
      <div style="font-size:12px;color:var(--accent-light);line-height:1.7">

        1. Place the AprilTag flat on a surface the robot can reach<br>

      </div>
    </div>
    <div class="hint" style="margin-top:10px;font-size:11px">Solves for <strong>T<sub>cam←base</sub></strong> via SVD point registration (Procrustes).</div>

    <div class="section-label">TCP Position (meters)</div>
    <div class="hint">Enter the robot's <strong>tool center point position</strong> from your controller. Only translation — no rotation needed.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px">
      <div>
        <label style="font-size:9px;font-family:var(--mono);color:var(--text-micro);display:block;margin-bottom:3px">X (m)</label>
        <input id="ee-x" type="number" value="0" step="0.001" style="width:100%;padding:6px 8px;border-radius:5px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-family:var(--mono);font-size:12px" />
      </div>
      <div>
        <label style="font-size:9px;font-family:var(--mono);color:var(--text-micro);display:block;margin-bottom:3px">Y (m)</label>
        <input id="ee-y" type="number" value="0" step="0.001" style="width:100%;padding:6px 8px;border-radius:5px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-family:var(--mono);font-size:12px" />
      </div>
      <div>
        <label style="font-size:9px;font-family:var(--mono);color:var(--text-micro);display:block;margin-bottom:3px">Z (m)</label>
        <input id="ee-z" type="number" value="0" step="0.001" style="width:100%;padding:6px 8px;border-radius:5px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-family:var(--mono);font-size:12px" />
      </div>
    </div>

    <button class="btn full" id="he-add-btn" onclick="addHEPair()" style="margin-bottom:14px">📍 Add Point</button>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span class="badge ${handeyePairs.length >= 3 ? 'green' : 'amber'}" id="he-pair-badge">${handeyePairs.length} / 3+ points</span>
      <span class="badge blue" id="he-tag-badge">—</span>
    </div>
    <div class="progress-bar"><div class="fill" id="he-progress" style="width:${Math.min(100, (handeyePairs.length / 3) * 100)}%"></div></div>

    <div id="he-feedback" style="font-size:12px;color:var(--text-dim);text-align:center;min-height:20px"></div>

      <div style="font-size:12px;color:var(--amber);line-height:1.6">
        <strong>Tips for accuracy:</strong><br>
        • Your robot's <strong>TCP must be calibrated</strong> — accuracy depends entirely on it<br>
        • Spread points across the workspace — <strong>avoid a straight line</strong><br>

  }

window.addHEPair = async function() {
  const btn = document.getElementById("he-add-btn");
  const fb = document.getElementById("he-feedback");
  btn.disabled = true;
  btn.textContent = "Capturing…";
  const vals = ["ee-x","ee-y","ee-z"].map(id => parseFloat(document.getElementById(id)?.value || 0));
  const r = await post("/api/touchpoint/pair", { tcp_pos: vals });
  btn.disabled = false;
  btn.textContent = "📍 Add Point";

  if (r.ok) {
    handeyePairs.push({ thumbnail: r.thumbnail });
    toast(`Point #${r.num_pairs} added`);
    fb.style.color = "var(--green)"; fb.textContent = `Point #${r.num_pairs} saved`;
    renderHEGrid();
    const p = document.getElementById("he-progress");
    if (p) p.style.width = Math.min(100, (handeyePairs.length / 3) * 100) + "%";
    const b = document.getElementById("he-pair-badge");
    if (b) { b.textContent = `${handeyePairs.length} / 3+ points`; b.className = "badge " + (handeyePairs.length >= 3 ? "green" : "amber"); }
    const cb = document.getElementById("he-cal-btn");
    if (cb && handeyePairs.length >= 3) cb.disabled = false;
  } else {
    toast(r.error || "Failed to add", false);
    fb.style.color = "var(--red)"; fb.textContent = r.error || "Failed — ensure tag is visible";
  }
}

// Debounced slider update
let _sliderTimeout = null;
window.onSlider = function(id, rawVal, min, max, step) {
  const val = parseFloat(rawVal);
  const pct = ((val - min) / (max - min)) * 100;
  const sv = document.getElementById("sv-" + id);
  const sf = document.getElementById("sf-" + id);
  const st = document.getElementById("st-" + id);
  const dec = step < 0.01 ? 6 : step < 1 ? 2 : 1;
  const unit = (id === "fx" || id === "fy" || id === "cx" || id === "cy") ? " px" : id.startsWith("rv") ? " rad" : (id === "tx" || id === "ty" || id === "tz") ? " m" : "";
  if (sv) sv.value = fmtNum(val, dec) + unit;
  if (sf) sf.style.width = pct + "%";
  if (st) st.style.left = `calc(${pct}% - 6px)`;

  clearTimeout(_sliderTimeout);
  _sliderTimeout = setTimeout(() => {
    // Determine which params changed
    const intrinsicKeys = ["fx","fy","cx","cy","k1","k2","p1","p2"];
    const extRvecKeys = ["rv0","rv1","rv2"];
    const extTKeys = ["tx","ty","tz"];

    if (intrinsicKeys.includes(id)) {
      const params = {};
      intrinsicKeys.forEach(k => {
        const el = document.querySelector(`#sg-${k} input[type=range]`);
        if (el) params[k] = parseFloat(el.value);
      });
      post("/api/adjust/intrinsic", params);
      if (calibrationResult) Object.assign(calibrationResult, params);
    } else if (extRvecKeys.includes(id) || extTKeys.includes(id)) {
      const rvec = [0,1,2].map(i => {
        const el = document.querySelector(`#sg-rv${i} input[type=range]`);
        return el ? parseFloat(el.value) : (extrinsicResult?.rvec?.[i] || 0);
      });
      const t = ["tx","ty","tz"].map(k => {
        const el = document.querySelector(`#sg-${k} input[type=range]`);
        return el ? parseFloat(el.value) : 0;
      });
      post("/api/adjust/extrinsic", { rvec, t });
      if (extrinsicResult) { extrinsicResult.rvec = rvec; extrinsicResult.t = t; }
    }
  }, 100);
}

window.switchTab = function(tab) {
  if (tab === activeTab) return;

  // Clean up previous tab
  if (activeTab === "debug") {
    if (_debugStreamActive) {
      stopStream();
      _debugStreamActive = false;
      updateCamDot(false);
    }
    stopDebugMetricsPoll();
  }

  activeTab = tab;

  // Update tab button styles
  document.querySelectorAll(".top-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === tab);
  });

  const stepBar = $("#step-bar");

  if (tab === "calibrate") {
    stepBar.style.display = "flex";
    goStep(currentStep);
  } else {
    // Debug & Tune mode
    stopStream();
    stepBar.style.display = "none";
    $("#stream-img").style.display = "none";
    $("#placeholder").style.display = "flex";
    renderDebugPanel();

}

    <div class="hint" style="margin-bottom:18px">Load a previous calibration and fine-tune parameters with a live camera feed. The overlay shows the undistorted image, AprilTag detection, and projected coordinate frames.</div>

    <!-- IMPORT SECTION -->
    <div class="debug-section">
      <div class="section-label">Import Calibration</div>
      <div class="hint">Paste your <code style="color:var(--accent-light)">calibration.json</code> contents below, or upload a file.</div>
      <textarea class="debug-import-area" id="debug-json-input" placeholder='{"intrinsic":{...}, "hand_eye":{...}}'>${hasCal ? '(parameters already loaded)' : ''}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px">
        <label class="btn sm" style="flex:1;text-align:center;cursor:pointer">
          📂 Upload File
          <input type="file" accept=".json" style="display:none" onchange="debugLoadFile(event)" />
        </label>
        <button class="btn primary sm" style="flex:1" onclick="debugLoadJSON()">Load JSON</button>
      </div>
      <div id="debug-load-status" style="font-size:11px;margin-top:6px;min-height:16px;color:var(--text-dim)">
        ${hasCal ? '<span style="color:var(--green)">✓ Intrinsics loaded</span>' : ''}
        ${hasHE ? ' <span style="color:var(--green)">✓ Hand-eye loaded</span>' : ''}
      </div>
    </div>

    <div class="divider"></div>

    <!-- TAG SIZE -->
    <div class="debug-section">
      <div class="section-label">AprilTag Size</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="debug-tag-size" type="number" value="${debugTagSize}" min="5" max="500" step="0.1"
          style="flex:1;padding:7px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-family:var(--mono);font-size:12px"
          onchange="debugTagSize=parseFloat(this.value);post('/api/handeye/config',{tag_size:debugTagSize/1000})" />
        <span style="font-size:11px;color:var(--text-dim);font-family:var(--mono)">mm</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- LIVE METRICS -->
    <div class="debug-section">
      <div class="section-label">Live Metrics</div>
      <div class="card" id="debug-metrics" style="font-size:11px;min-height:60px">
        <div class="debug-metric"><span class="label">Tag detected</span><span class="value" id="dm-tag">—</span></div>
        <div class="debug-metric"><span class="label">Tag RPE</span><span class="value" id="dm-rpe">—</span></div>
        <div class="debug-metric"><span class="label">Tag distance</span><span class="value" id="dm-dist">—</span></div>
        <div class="debug-metric"><span class="label">HE loaded</span><span class="value" id="dm-he">${hasHE ? '✓' : '—'}</span></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- INTRINSIC SLIDERS -->
    <div class="debug-section" id="debug-intrinsics-section" style="${hasCal ? '' : 'opacity:0.4;pointer-events:none'}">
      <div class="section-label">Intrinsics</div>
      ${debugMakeSliders("intrinsic")}
    </div>

    <div class="divider"></div>

    <!-- ROBOT-TO-CAMERA TRANSFORM SLIDERS -->
    <div class="debug-section" id="debug-he-section" style="${hasHE ? '' : 'opacity:0.4;pointer-events:none'}">
      <div class="section-label">Robot → Camera Transform</div>
      ${debugMakeSliders("handeye")}
    </div>

    <div class="divider"></div>

    <!-- START STREAM BUTTON -->
    <div class="debug-section">
      <button class="btn primary full" id="debug-stream-btn" onclick="debugToggleStream()" ${hasCal ? '' : 'disabled'}>
        ▶ Start Live Feed
      </button>
    </div>
  `;

  footer.innerHTML = `
    <a href="/api/export" download="calibration.json" class="btn primary" style="flex:1;text-align:center;text-decoration:none">⬇ Export</a>
    <button class="btn" onclick="switchTab('calibrate')">← Wizard</button>
  `;

  // Start live metric updater
  startDebugMetricsPoll();
}

function debugMakeSliders(group) {
  function sl(id, label, value, min, max, step, unit = "") {
    const pct = Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));
    const dec = step < 0.001 ? 6 : step < 0.1 ? 4 : step < 1 ? 2 : 1;
    return `<div class="slider-group" id="sg-dbg-${id}">
      <div class="slider-header">
        <span class="lbl">${label}</span>
        <input class="val" id="sv-dbg-${id}" type="text" value="${fmtNum(value, dec)}${unit}"
          onchange="sliderValFromInput('dbg-${id}', this, ${min}, ${max}, ${step}, v => onDebugSlider('${group}','${id}',v,${min},${max},${step}))"
          onkeydown="if(event.key==='Enter'){this.blur()}" />
      </div>
      <div class="slider-track">
        <div class="bg"></div>
        <div class="fill" id="sf-dbg-${id}" style="width:${pct}%"></div>
        <input type="range" min="${min}" max="${max}" step="${step}" value="${value}"
          oninput="onDebugSlider('${group}','${id}',this.value,${min},${max},${step})" />
        <div class="thumb" id="st-dbg-${id}" style="left:calc(${pct}% - 6px)"></div>
      </div>
    </div>`;
  }

  if (group === "intrinsic") {
    const cal = calibrationResult || {};
    return [
      sl("fx", "fx", cal.fx || 800, 100, 3000, 1, " px"),
      sl("fy", "fy", cal.fy || 800, 100, 3000, 1, " px"),
      sl("cx", "cx", cal.cx || 640, 0, 1920, 1, " px"),
      sl("cy", "cy", cal.cy || 360, 0, 1080, 1, " px"),
      '<div style="height:8px"></div>',
      sl("k1", "k1", cal.k1 || 0, -2, 2, 0.0001),
      sl("k2", "k2", cal.k2 || 0, -1, 1, 0.0001),
      sl("p1", "p1", cal.p1 || 0, -0.1, 0.1, 0.00001),
      sl("p2", "p2", cal.p2 || 0, -0.1, 0.1, 0.00001),
    ].join("");
  }

  // handeye
  const he = handeyeResult || {};
  const rv = he.rvec || [0, 0, 0];
  const t = he.t || [0, 0, 0];
  return [
    '<div style="font-size:10px;color:var(--text-micro);margin-bottom:6px">Rotation (Rodrigues)</div>',
    sl("hrv0", "rvec[0]", rv[0], -3.15, 3.15, 0.001, " rad"),
    sl("hrv1", "rvec[1]", rv[1], -3.15, 3.15, 0.001, " rad"),
    sl("hrv2", "rvec[2]", rv[2], -3.15, 3.15, 0.001, " rad"),
    '<div style="height:8px"></div>',
    '<div style="font-size:10px;color:var(--text-micro);margin-bottom:6px">Translation</div>',
    sl("htx", "tx", t[0], -2, 2, 0.0005, " m"),
    sl("hty", "ty", t[1], -2, 2, 0.0005, " m"),
    sl("htz", "tz", t[2], -2, 2, 0.0005, " m"),
  ].join("");
}

let _debugSliderTimeout = null;
window.onDebugSlider = function(group, id, rawVal, min, max, step) {
  const val = parseFloat(rawVal);
  const pct = ((val - min) / (max - min)) * 100;
  const sv = document.getElementById("sv-dbg-" + id);
  const sf = document.getElementById("sf-dbg-" + id);
  const st = document.getElementById("st-dbg-" + id);
  const dec = step < 0.001 ? 6 : step < 0.1 ? 4 : step < 1 ? 2 : 1;
  const unit = id.startsWith("h") && id.includes("rv") ? " rad"
             : id.startsWith("ht") ? " m"
             : id === "fx" || id === "fy" || id === "cx" || id === "cy" ? " px" : "";
  if (sv) sv.value = fmtNum(val, dec) + unit;
  if (sf) sf.style.width = pct + "%";
  if (st) st.style.left = `calc(${pct}% - 6px)`;

  clearTimeout(_debugSliderTimeout);
  _debugSliderTimeout = setTimeout(() => {
    if (group === "intrinsic") {
      const params = {};
      ["fx","fy","cx","cy","k1","k2","p1","p2"].forEach(k => {
        const el = document.querySelector(`#sg-dbg-${k} input[type=range]`);
        if (el) params[k] = parseFloat(el.value);
      });
      post("/api/adjust/intrinsic", params).then(r => {
        if (r.ok && r.result) calibrationResult = r.result;
      });
    } else {
      const rvec = [0,1,2].map(i => {
        const el = document.querySelector(`#sg-dbg-hrv${i} input[type=range]`);
        return el ? parseFloat(el.value) : 0;
      });
      const t = ["htx","hty","htz"].map(k => {
        const el = document.querySelector(`#sg-dbg-${k} input[type=range]`);
        return el ? parseFloat(el.value) : 0;
      });
      post("/api/adjust/handeye", { rvec, t }).then(r => {
        if (r.ok && r.result) handeyeResult = r.result;
      });
    }
  }, 80);
}

let _debugStreamActive = false;
window.debugToggleStream = function() {
  const btn = document.getElementById("debug-stream-btn");
  if (_debugStreamActive) {
    stopStream();
    _debugStreamActive = false;
    if (btn) { btn.textContent = "▶ Start Live Feed"; btn.classList.remove("danger"); btn.classList.add("primary"); }
    updateCamDot(false);
  } else {
    startStream("debug");
    _debugStreamActive = true;
    if (btn) { btn.textContent = "■ Stop Feed"; btn.classList.remove("primary"); btn.classList.add("danger"); }
    updateCamDot(true);
  }
}

window.debugLoadJSON = async function() {
  const ta = document.getElementById("debug-json-input");
  const status = document.getElementById("debug-load-status");
  if (!ta || !ta.value.trim()) {
    if (status) { status.innerHTML = '<span style="color:var(--red)">Paste JSON first</span>'; }
    return;
  }
  let data;
  try {
    data = JSON.parse(ta.value.trim());
  } catch (e) {
    if (status) { status.innerHTML = `<span style="color:var(--red)">Invalid JSON: ${e.message}</span>`; }
    return;
  }
  await debugApplyJSON(data, status);
}

window.debugLoadFile = function(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const status = document.getElementById("debug-load-status");
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch (err) {
      if (status) status.innerHTML = `<span style="color:var(--red)">Invalid JSON file</span>`;
      return;
    }
    // Also populate the textarea for visibility
    const ta = document.getElementById("debug-json-input");
    if (ta) ta.value = JSON.stringify(data, null, 2);
    await debugApplyJSON(data, status);
  };
  reader.readAsText(file);
}

async function debugApplyJSON(data, statusEl) {
  const r = await post("/api/load", data);
  if (!r.ok) {
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--red)">❌ ${r.error || 'Load failed'}</span>`;
    return;
  }

  const parts = [];
  if (r.loaded.intrinsic) parts.push("Intrinsics");
  if (r.loaded.extrinsic) parts.push("Extrinsic");
  if (r.loaded.hand_eye) parts.push("Hand-Eye");

  if (statusEl) statusEl.innerHTML = `<span style="color:var(--green)">✓ Loaded: ${parts.join(", ")}</span>`;
  toast(`Loaded: ${parts.join(", ")}`);

  // Sync local state — fetch from export to get the canonical form
  const exportData = await api("/api/export");

  if (r.loaded.intrinsic && exportData.intrinsic) {
    const p = exportData.intrinsic.parameters;
    calibrationResult = {
      ...p,
      rpe: exportData.intrinsic.reprojection_error || 0,
      image_size: exportData.intrinsic.image_size,
      K: exportData.intrinsic.camera_matrix,
      dist: exportData.intrinsic.distortion_coefficients,
      per_view_errors: [],
      num_frames: 0,
    };
  }

  if (r.loaded.hand_eye && exportData.hand_eye) {
    const h = exportData.hand_eye;
    handeyeResult = {
      R: h.rotation_matrix,
      t: h.translation_vector,
      rvec: h.rodrigues_vector,
      method: h.method || "imported",
      config: h.configuration || "imported",
      residual: h.residual || 0,
      num_pairs: h.num_pose_pairs || 0,
      all_methods: h.all_methods || {},
    };
  }

  if (r.loaded.extrinsic && exportData.extrinsic) {
    const e = exportData.extrinsic;
    extrinsicResult = {
      R: e.rotation_matrix,
      t: e.translation_vector,
      rvec: e.rodrigues_vector,
      tag_id: e.tag_id,
      tag_size: e.tag_size_meters,
      rpe: e.reprojection_error,
    };
  }

  // Re-render the panel to enable sections
  renderDebugPanel();
}

let _debugMetricsPoll = null;
function startDebugMetricsPoll() {
  stopDebugMetricsPoll();
  _debugMetricsPoll = setInterval(async () => {
    if (activeTab !== "debug" || !_debugStreamActive) return;
    const s = await api("/api/status");
    const tagEl = document.getElementById("dm-tag");
    const rpeEl = document.getElementById("dm-rpe");
    const distEl = document.getElementById("dm-dist");
    const heEl = document.getElementById("dm-he");
    if (tagEl) {
      tagEl.textContent = s.apriltag_detected ? "✓ Yes" : "No";
      tagEl.style.color = s.apriltag_detected ? "var(--green)" : "var(--red)";
    }
    // RPE and distance come from the OSD on the feed (backend computes them).
    // We show what we can from the status endpoint.
    if (heEl) {
      heEl.textContent = s.has_handeye ? "✓ Active" : "—";
      heEl.style.color = s.has_handeye ? "var(--green)" : "var(--text-dim)";
    }
  }, 400);
}
function stopDebugMetricsPoll() {
  if (_debugMetricsPoll) { clearInterval(_debugMetricsPoll); _debugMetricsPoll = null; }
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
goStep(0);
</script>
